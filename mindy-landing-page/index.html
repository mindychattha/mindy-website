<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Move with Mindy | Mindy Chattha, CENTURY 21 Bamber Realty Ltd.</title>
<meta name="description" content="Buying or selling in Calgary? Book a free, no-obligation consultation with Mindy Chattha, a Calgary REALTOR® focused on the inner city and beyond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #1D3025;
    --forest-deep: #16241C;
    --gold: #C5A35E;
    --gold-soft: #D8BE8B;
    --cream: #F7F6F2;
    --cream-warm: #F1EFE7;
    --charcoal: #2A2A28;
    --sage: rgba(29,48,37,0.42);
    --sage-line: rgba(29,48,37,0.28);
    --hairline: rgba(29,48,37,0.16);
    --max-w: 1120px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Jost', sans-serif;
    font-size:17px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--forest);
    margin:0 0 0.4em;
    letter-spacing:-0.01em;
  }
  p{margin:0 0 1em;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:var(--max-w); margin:0 auto; padding:0 28px;}

  :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- HEADER ---------- */
  header{
    padding:22px 0;
    border-bottom:1px solid var(--hairline);
  }
  header .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand-mark{display:flex; align-items:center; gap:14px;}
  .brand-mark img{height:40px; width:auto;}
  .brand-mark .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:15px;
    color:var(--forest);
    line-height:1.2;
    white-space:nowrap;
  }
  .brokerage-mark img{height:52px; width:auto;}
  .header-call{
    font-family:'Jost',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--forest);
    text-decoration:none;
    border-bottom:1px solid var(--gold);
    padding-bottom:2px;
    white-space:nowrap;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding:64px 0 0;
    overflow:hidden;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:40px;
    align-items:end;
  }
  .hero-copy{padding-bottom:56px;}
  .eyebrow-line{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
    color:var(--forest);
    font-size:15px;
  }
  .eyebrow-line .rule{width:36px; height:1px; background:var(--gold);}
  h1{
    font-size:clamp(2.4rem, 5vw, 3.6rem);
    line-height:1.06;
    max-width:11.5ch;
  }
  h1 em{font-style:italic; color:var(--gold);}
  .hero-sub{
    font-size:19px;
    max-width:38ch;
    color:var(--charcoal);
    margin:20px 0 30px;
  }
  .cta-row{display:flex; gap:16px; flex-wrap:wrap;}
  .btn{
    display:inline-block;
    font-family:'Jost',sans-serif;
    font-weight:500;
    font-size:15px;
    text-decoration:none;
    padding:15px 28px;
    border-radius:2px;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary{
    background:var(--forest);
    color:var(--cream);
    border:1px solid var(--forest);
  }
  .btn-primary:hover{background:var(--forest-deep);}
  .btn-secondary{
    background:transparent;
    color:var(--forest);
    border:1px solid var(--hairline);
  }
  .btn-secondary:hover{border-color:var(--forest);}

  .hero-photo{
    position:relative;
    display:flex;
    justify-content:center;
  }
  .hero-photo .photo-frame{
    position:relative;
    width:82%;
    aspect-ratio:4/5;
  }
  .hero-photo .photo-frame::before{
    content:"";
    position:absolute;
    top:20px; left:20px;
    width:100%; height:100%;
    border:1px solid var(--gold);
    border-radius:6px;
    z-index:0;
  }
  .hero-photo .photo-frame img{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 15%;
    border-radius:6px;
    display:block;
  }

  /* ---------- INTRO STRIP ---------- */
  .intro-strip{
    padding:50px 0 60px;
    border-bottom:1px solid var(--hairline);
  }
  .intro-strip .wrap{
    display:grid;
    grid-template-columns:0.9fr 1.6fr;
    gap:40px;
  }
  .intro-strip h2{font-size:26px; max-width:14ch;}
